
services:
  postgres:
    image: postgres:18-alpine
    container_name: Bluemoon_DB

    environment:
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}

    ports:
      - "${DATABASE_PORT:-54322}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-postgres}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
